services:
  - type: web
    name: shuttle-tracker-internal-campus-transport
    runtime: node
    plan: free
    buildCommand: npm ci && npm ci --prefix client && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_TTL_DAYS
        value: "30"
