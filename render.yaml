services:
  - type: web
    name: shuttle-tracker-internal-campus-transport
    runtime: node
    plan: free
    buildCommand: npm ci && npm ci --prefix client --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "3001"
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: DEMO_STUDENT_EMAIL
        value: "student@campus.demo"
      - key: DEMO_STUDENT_PASSWORD
        sync: false
